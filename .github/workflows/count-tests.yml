# =============================================================================
# `check_test_counts.py` lists the tests of the Go and Rust suites with the native listing of their runner, which compiles them and is
# therefore not run on a plain PC. This workflow fetches every repository next to this one, runs the check there and prints what it
# measured. Every Monday (and by hand) it also writes the numbers of the toolchains into data/glance.json (`tests.method: "exact"` is what
# turns the Tests line of a README green) and opens one pull request here when the file changed; the READMEs of the other repositories are then
# regenerated from it.
name: HYDRA-UMC count the tests of the family

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  count:
    name: Count the tests of every repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: HYDRA-UMC-DOCS

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Fetch the other repositories next to it
        working-directory: HYDRA-UMC-DOCS
        run: |
          python - <<'PY' > ../family.txt
          import sys
          sys.path.insert(0, "src")
          from hydra_umc_docs.readme_family import all_names
          print("\n".join(sorted((all_names() | {"ELECTRO-HOBBY-3D-UPDATER"}) - {"HYDRA-UMC-DOCS"})))
          PY
          cd ..
          while read -r repository; do
            git clone --quiet --depth 1 "https://github.com/JuanenRac/${repository}.git" "${repository}" || echo "::warning::could not fetch ${repository}"
          done < family.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install the dependencies of the JavaScript and Dart suites
        run: |
          for repository in HYDRA-UMC-SERVER HYDRA-UMC-STUDIO HYDRA-UMC-OPCUA-SERVER HYDRA-UMC-DASHBOARD-AI HYDRA-UMC-GATEWAY-INDUSTRIAL HYDRA-UMC-MQTT-BROKER HYDRA-UMC-MTCONNECT-ADAPTER HYDRA-UMC-STUDIO-KIT; do
            (cd "${repository}" && npm ci --ignore-scripts --no-audit --no-fund) || echo "::warning::npm ci failed in ${repository}"
          done
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          for repository in HYDRA-UMC-IOS-CONTROL HYDRA-UMC-DSI HYDRA-UMC-ANDROID-CONTROL HYDRA-UMC-WATCH; do
            [ -f "${repository}/pubspec.yaml" ] && (cd "${repository}" && flutter pub get) || echo "::warning::flutter pub get skipped in ${repository}"
          done

      - name: Install the Python dependencies of the suites (best effort)
        run: |
          python -m pip install --quiet pytest || true
          for directory in HYDRA-UMC-*/; do
            repository="${directory%/}"
            [ "$repository" = "HYDRA-UMC-DOCS" ] && continue
            if [ -f "${repository}/pyproject.toml" ]; then
              python -m pip install --quiet -e "./${repository}[dev]" 2>/dev/null || python -m pip install --quiet -e "./${repository}" 2>/dev/null || echo "::warning::pip install skipped in ${repository}"
            fi
          done

      - name: Write the counts that were collected into the glance data and open one pull request
        working-directory: HYDRA-UMC-DOCS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one pass: it prints what it measured and writes the exact counts
          python tools/check_test_counts.py --apply || true
          python tools/make_glance.py --apply --repo HYDRA-UMC-DOCS --workspace .. || true
          if git diff --quiet -- data/glance.json; then echo "No count changed."; exit 0; fi
          branch="test-counts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/glance.json README.md README_deu.md README_fra.md README_ita.md README_jpn.md README_por.md README_spa.md README_zho.md
          git commit -m "Record the test counts collected by the toolchains"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch"
          if [ -z "$(gh pr list --repo "${{ github.repository }}" --head "$branch" --json number --jq '.[0].number')" ]; then
            gh pr create --repo "${{ github.repository }}" --head "$branch" --base main --title "Record the test counts collected by the toolchains"               --body "The weekly count of the tests of the family changed data/glance.json: the numbers come from the listings of the runners of each suite, and tests.method exact marks the ones that were collected. The READMEs of the other repositories are regenerated from this file afterwards."               || echo "::warning::the pull request could not be opened; the branch ${branch} holds the change"
          fi
