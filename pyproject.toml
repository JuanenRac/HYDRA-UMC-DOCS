[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-docs"
version = "0.0.6"
description = "Documentation and cross-repository tooling hub of the HYDRA-UMC ecosystem: architecture, interfaces, security baseline, capability matrix, project catalogue and the tools that keep them honest."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["hydra-umc", "documentation", "architecture", "capability-matrix", "catalog"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/JuanenRac/HYDRA-UMC-DOCS"

[project.scripts]
hydra-umc-docs = "hydra_umc_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
